
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Inteligente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Calculadora</h1>

        <!-- CALCULADORA NORMAL -->
        <section class="calculadora">

            <h2>Calculadora Básica</h2>

            <input type="text" id="tela" value="0" readonly>

            <div class="botoes">

                <button class="especial" data-action="clear">AC</button>
                <button class="especial" data-action="delete">DEL</button>
                <button class="operador" data-action="percent">%</button>
                <button class="operador" data-operator="/">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operador" data-operator="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operador" data-operator="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operador" data-operator="+">+</button>

                <button data-action="sign">+/-</button>
                <button data-number="0">0</button>
                <button data-action="decimal">.</button>
                <button class="igual" data-action="equals">=</button>

            </div>
        </section>

        <!-- CALCULADORA DE BHASKARA -->
        <section class="bhaskara">

            <h2>Fórmula de Bhaskara</h2>

            <div class="formula">
                Δ = b² - 4ac
                <br>
                X = (-b ± √Δ) / 2a
            </div>

            <label>Valor de A</label>
            <input type="number" id="valorA" placeholder="Digite A">

            <label>Valor de B</label>
            <input type="number" id="valorB" placeholder="Digite B">

            <label>Valor de C</label>
            <input type="number" id="valorC" placeholder="Digite C">

            <button class="calcular" id="calcularBhaskara">
                Calcular Bhaskara
            </button>

            <div class="resultado" id="resultadoBhaskara">
                Resultado aparecerá aqui.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>

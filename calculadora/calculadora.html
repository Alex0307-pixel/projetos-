
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Bhaskara</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora</h1>
        <h3>Fórmula de Bhaskara</h3>

        <div class="formula">
            Δ = b² - 4ac
            <br>
            x = (-b ± √Δ) / 2a
        </div>

        <label>Valor de A</label>
        <input type="number" id="a" placeholder="Digite o valor de A">

        <label>Valor de B</label>
        <input type="number" id="b" placeholder="Digite o valor de B">

        <label>Valor de C</label>
        <input type="number" id="c" placeholder="Digite o valor de C">

        <button onclick="calcular()">Calcular</button>
        <button class="limpar" onclick="limpar()">Limpar</button>

        <div class="resultado" id="resultado">
            <h3>Resultado</h3>
            <p>Informe os valores para começar.</p>
        </div>
    </div>

    <script src="calculadora.js"></script>
</body>
</html>
